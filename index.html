<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym-Mind | Transforme seu Corpo e Mente</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header / Nav -->
    <header>
        <div class="logo-placeholder"></div>
        <nav>
            <ul>
                <li><div class="nav-placeholder"></div></li>
                <li><div class="nav-placeholder"></div></li>
                <li><div class="nav-placeholder"></div></li>
                <li><div class="nav-placeholder"></div></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>GYM-MIND</h1>
        </div>
    </section>

    <!-- Info Section -->
    <section class="info-section">
        <div class="info-box left">
            <div class="inner-box"></div>
        </div>
        <div class="info-box right">
        </div>
    </section>

    <!-- Modalidades Section (Agora com Carrossel) -->
    <section class="modalidades-section">
        <button class="btn-modalidades">Modalidades</button>
        
        <div class="carousel-container">
            <button class="carousel-btn prev" aria-label="Anterior">&lt;</button>
            <div class="carousel-track-container">
                <div class="carousel-track">
                    <!-- Coloquei 6 cards para podermos ver o carrossel se movendo -->
                    <div class="card"><div class="card-inner"></div></div>
                    <div class="card"><div class="card-inner"></div></div>
                    <div class="card"><div class="card-inner"></div></div>
                    <div class="card"><div class="card-inner"></div></div>
                    <div class="card"><div class="card-inner"></div></div>
                    <div class="card"><div class="card-inner"></div></div>
                </div>
            </div>
            <button class="carousel-btn next" aria-label="Próximo">&gt;</button>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
